version: '3.8'

services:
  redis:
    image: redis:alpine
    expose:
      - "6379"
    restart: always
    networks:
      - app-network

  api:
    build: ./api
    expose:
      - "5000"
    depends_on:
      - redis
    restart: always
    networks:
      - app-network
    deploy:
      replicas: 3

  worker:
    build: ./worker
    depends_on:
      - redis
    restart: always
    networks:
      - app-network
    deploy:
      replicas: 3

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
