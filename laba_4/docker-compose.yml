version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    expose:
      - "5000"
    depends_on:
      - redis
    restart: always

  worker:
    build: ./worker
    depends_on:
      - redis
    restart: always

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always